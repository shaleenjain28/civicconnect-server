# ─── CivicConnect Server Configuration ───

server:
  port: 8080
  servlet:
    context-path: /api

# ── Database ──
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/civicconnect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway handles migrations — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false   # Prevents lazy-loading in controllers (best practice)

  # ── Flyway Migrations ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Actuator (health checks) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ── API Documentation ──
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Supabase (for JWT validation) ──
app:
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
